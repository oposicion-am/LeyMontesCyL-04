<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test · Normativa de Montes (50)</title>
<style>
:root{--verde:#2f6b3a;--verde2:#e8f1e9;--tinta:#1f2a24;--gris:#6b7770;--borde:#d5ddd7;--ok:#1f7a3a;--okbg:#e4f4e8;--ko:#b3261e;--kobg:#fbe9e7;--fondo:#f6f8f6}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--tinta);line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 40px}
header h1{font-size:1.25rem;margin:0 0 4px;color:var(--verde)}
header p{margin:0;color:var(--gris);font-size:.92rem}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:.88rem;color:var(--gris)}
.bar{flex:1;height:8px;background:#dfe6e1;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--gris)}
.tag{padding:2px 9px;border-radius:20px;background:var(--verde2);color:var(--verde);font-weight:bold;font-size:.78rem}
.q{font-size:1.06rem;font-weight:bold;margin:0 0 16px;text-align:justify}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--borde);border-radius:9px;padding:11px 13px;margin:0 0 9px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--verde);background:#f7fbf8}
.opt b{min-width:20px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.why{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:.93rem;text-align:justify;display:none}
.why.ok{display:block;background:var(--okbg);border-left:4px solid var(--ok)}
.why.ko{display:block;background:var(--kobg);border-left:4px solid var(--ko)}
.actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:bold;cursor:pointer}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center}
.big{font-size:3rem;font-weight:bold;color:var(--verde);margin:6px 0}
.result ul{text-align:left;padding-left:18px}
.result li{margin-bottom:8px;text-align:justify}
footer{margin-top:34px;text-align:center;font-size:.8rem;color:var(--gris)}
footer a{color:var(--gris);text-decoration:underline;cursor:pointer}
#lock{display:none;margin-top:12px}
#lock input{padding:8px 10px;border:1px solid var(--borde);border-radius:7px;font:inherit;width:200px}
#lockmsg{color:var(--ko);font-size:.85rem;min-height:1.2em;margin-top:6px}
#word{display:none}
#wordbody{background:#fff;border:1px solid var(--borde);padding:28px 34px;font-family:Arial;font-size:11pt}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  #wordbody{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="quiz">
    <header class="noprint">
      <h1>TEST DE EVALUACIÓN - Normativa de Montes: Ley 3/2009 de Montes de Castilla y León, Decreto 5/2025 de aprovechamientos forestales y Decreto 9/2024 de cambio de uso forestal</h1>
      <p>50 preguntas · una sola respuesta correcta · corrección inmediata</p>
    </header>
    <div class="prog noprint"><span id="cnt">1 / 50</span><div class="bar"><i id="barfill"></i></div><span id="score">0 aciertos</span></div>
    <div class="card" id="stage"></div>
  </div>

  <div id="word">
    <div class="actions noprint" style="justify-content:flex-start;margin-bottom:14px">
      <button class="btn" onclick="copyWord()">Copiar para Word</button>
      <button class="btn" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="downloadDoc()">Descargar .doc</button>
      <button class="btn sec" onclick="closeWord()">Volver al test</button>
      <span id="copymsg" style="align-self:center;font-size:.85rem;color:var(--ok)"></span>
    </div>
    <div id="wordbody"></div>
  </div>

  <footer class="noprint" id="foot">
    <a onclick="toggleLock()">Acceso docente</a>
    <div id="lock">
      <input type="password" id="pw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()">
      <button class="btn" style="padding:8px 14px" onclick="unlock()">Entrar</button>
      <div id="lockmsg"></div>
    </div>
  </footer>
</div>

<script>
const DATA = [{"d": "Fácil", "q": "Según la Ley 3/2009, los montes que no son propiedad de la Comunidad de Castilla y León ni están catalogados de utilidad pública son administrados por:", "o": ["Sus propietarios, con el control y la intervención de la consejería competente en materia de montes.", "Los ayuntamientos en cuyo término municipal radiquen.", "La consejería competente en materia de montes, de forma exclusiva.", "Sus propietarios y la consejería de forma conjunta, en régimen de gestión compartida."], "c": 0, "w": "Art. 7.3 de la Ley 3/2009: los montes no incluidos en los apartados 1 (propiedad de la Comunidad) y 2 (catalogados, de administración conjunta) son administrados por sus propietarios, con el control y la intervención de la consejería."}, {"d": "Medio", "q": "La corrección de los errores materiales o de hecho que contenga el Catálogo de Montes de Utilidad Pública:", "o": ["Solo puede hacerse mediante acuerdo de la Junta de Castilla y León, previo informe de la entidad titular.", "Puede realizarla la consejería competente en materia de montes en cualquier momento, y precisa su publicación en el Boletín Oficial de Castilla y León.", "Corresponde al Ministerio competente en materia de montes, a propuesta de la Comunidad.", "Exige seguir el mismo procedimiento que la inclusión, con información pública y audiencia."], "c": 1, "w": "Art. 12.5 de la Ley 3/2009: la consejería puede corregir los errores materiales o de hecho del Catálogo en cualquier momento, con publicación en el BOCYL. Las inclusiones y exclusiones, en cambio, se aprueban por orden previa información pública (art. 12.4)."}, {"d": "Medio", "q": "El procedimiento de inclusión de un monte en el Catálogo de Montes de Utilidad Pública:", "o": ["Puede iniciarlo cualquier ciudadano mediante solicitud dirigida al servicio territorial.", "Lo inicia la consejería competente en materia de montes, de oficio o a instancia del titular del monte público, y la consejería elabora una memoria justificativa de la causa de utilidad pública.", "Lo inicia siempre la entidad local propietaria, que redacta la memoria justificativa.", "Lo inicia el Consejo de Gobierno de la Junta, previo dictamen del Consejo Consultivo."], "c": 1, "w": "Art. 14.1 de la Ley 3/2009: inicia la consejería, de oficio o a instancia del titular del monte público, y elabora la memoria justificativa. Las entidades locales propietarias informan preceptivamente (art. 14.2) y el expediente se somete a información pública (art. 14.3)."}, {"d": "Medio", "q": "La división de un monte catalogado de utilidad pública perteneciente en pro indiviso a varias entidades exige:", "o": ["Una sentencia firme dictada en juicio ordinario de división de la cosa común.", "Solo el acuerdo unánime de los copropietarios, que se comunicará a la consejería.", "El acuerdo entre los copropietarios y un informe previo favorable de la consejería que acredite que la nueva distribución no menoscaba la utilidad pública del monte.", "Su previa exclusión del Catálogo por orden de la consejería."], "c": 2, "w": "Art. 18 de la Ley 3/2009: además del acuerdo entre copropietarios, es necesario un informe previo favorable de la consejería que acredite que la nueva distribución no menoscaba la utilidad pública ni las posibilidades futuras de gestión y aprovechamiento."}, {"d": "Medio", "q": "Según la Ley 3/2009, la permuta de una parte de un monte catalogado de utilidad pública:", "o": ["Requiere ley de las Cortes de Castilla y León.", "Está prohibida en todo caso por el carácter demanial del monte.", "Solo cabe sobre una parte no significativa del monte cuando mejore la definición de linderos, su gestión o su conservación, salvo excepciones que no menoscaben la utilidad pública.", "Puede afectar a cualquier superficie siempre que el valor de los terrenos recibidos sea superior."], "c": 2, "w": "Art. 20.1 de la Ley 3/2009: permuta de una parte no significativa cuando mejore linderos, gestión o conservación; excepcionalmente, por otras razones que no menoscaben la utilidad pública. La autoriza la consejería con conformidad de los propietarios y comporta la exclusión automática de lo permutado y la inclusión de los terrenos recibidos (art. 20.2)."}, {"d": "Fácil", "q": "Para la defensa de los montes PATRIMONIALES, la entidad pública propietaria ostenta las potestades administrativas de:", "o": ["Investigación, deslinde, recuperación de oficio y desahucio administrativo.", "Únicamente deslinde y amojonamiento.", "Desahucio administrativo y recuperación de oficio.", "Investigación, deslinde y recuperación de oficio."], "c": 3, "w": "Art. 22.2 de la Ley 3/2009: en los montes patrimoniales, investigación, deslinde y recuperación de oficio. El desahucio administrativo solo figura entre las potestades para la defensa de los montes demaniales (art. 22.1.d)."}, {"d": "Alto", "q": "En el procedimiento de investigación de la titularidad de un monte que se presume público, el acuerdo de iniciación:", "o": ["No se publica, porque la investigación tiene carácter reservado hasta su resolución.", "Se notifica únicamente a los colindantes, sin publicación oficial.", "Se publica en el Boletín Oficial de Castilla y León y se exhibe una copia en el tablón de edictos del ayuntamiento donde radique el monte.", "Se publica en el Boletín Oficial del Estado y en un diario de mayor difusión de la provincia."], "c": 2, "w": "Art. 25.4 de la Ley 3/2009: el procedimiento se inicia de oficio (por iniciativa propia o denuncia de particulares); el acuerdo se publica en el BOCYL y se exhibe copia en el tablón de edictos del ayuntamiento, con trámite de audiencia a los interesados."}, {"d": "Medio", "q": "Cuando un monte catalogado se incluye en un procedimiento de concentración parcelaria, la superficie resultante del monte:", "o": ["No podrá ser inferior a la inicialmente aportada.", "Podrá reducirse si la entidad titular recibe compensación económica.", "Será la que fije el acuerdo de concentración, sin límite alguno.", "Podrá reducirse hasta un 10 % si mejora la forma de las fincas."], "c": 0, "w": "Art. 33.2 de la Ley 3/2009: la superficie resultante no puede ser inferior a la aportada. Los terrenos que dejan de pertenecer al monte salen automáticamente del Catálogo y los que se integran entran simultáneamente en él."}, {"d": "Medio", "q": "Respecto a los instrumentos de ordenación forestal, la Ley 3/2009 establece que:", "o": ["Son únicamente los Planes de Ordenación de los Recursos Forestales, aprobados por Decreto.", "Los aprueba el Consejo de Gobierno, en un plazo máximo de seis meses.", "Entre otros, son los Proyectos de Ordenación de Montes y los Planes Dasocráticos, y el plazo máximo de su procedimiento de aprobación no excederá de un año.", "Solo pueden referirse a un único monte, sin posibilidad de agrupación."], "c": 2, "w": "Art. 38 de la Ley 3/2009: son instrumentos de ordenación, entre otros, los Proyectos de Ordenación y los Planes Dasocráticos (38.1); pueden abarcar uno o varios montes agrupados (38.2); los aprueba la consejería y el plazo reglamentario de aprobación no excederá de un año (38.4)."}, {"d": "Fácil", "q": "¿Cuál de las siguientes actividades NO tiene la condición de aprovechamiento forestal según el artículo 42 de la Ley 3/2009?", "o": ["Las plantas aromáticas, medicinales y melíferas.", "La biomasa forestal.", "La actividad cinegética.", "El uso recreativo del monte como espacio o soporte físico."], "c": 3, "w": "Art. 42.2 de la Ley 3/2009 enumera como aprovechamientos los maderables y leñosos (incluida la biomasa), pastos, resina, actividad cinegética, frutos, hongos, corcho y plantas aromáticas, medicinales y melíferas. La utilización del terreno como espacio o soporte físico es un «uso» (art. 59)."}, {"d": "Medio", "q": "En la ejecución de los aprovechamientos forestales, la consejería competente en materia de montes dispone, además de la facultad de autorizarlos u oponerse a ellos, de las facultades de:", "o": ["Adjudicación, enajenación y cobro del precio.", "Fijación de las condiciones económico-administrativas de los contratos.", "Expropiación de los productos obtenidos.", "Señalamiento, demarcación, inspección y reconocimiento."], "c": 3, "w": "Art. 44.2 de la Ley 3/2009: en la ejecución de los aprovechamientos la consejería dispone de las facultades de señalamiento, demarcación, inspección y reconocimiento. Las condiciones económico-administrativas corresponden a la entidad titular (art. 46.5)."}, {"d": "Medio", "q": "El Plan Anual de Aprovechamientos que elabora y aprueba la consejería comprende:", "o": ["Los aprovechamientos a efectuar en el plazo de un año, en cada provincia, en los montes catalogados, en los de propiedad de la Comunidad y en los contratados con ella.", "Exclusivamente los aprovechamientos extraordinarios del año.", "Todos los aprovechamientos de los montes públicos y privados de la provincia.", "Los aprovechamientos de un quinquenio en los montes con instrumento de ordenación."], "c": 0, "w": "Art. 49.1 de la Ley 3/2009: relación de los aprovechamientos de un año, por provincia, en los montes catalogados, los de propiedad de la Comunidad y los contratados con ella. Los incluidos en él son ordinarios (art. 49.4); los forzosos no incluidos son extraordinarios (art. 50)."}, {"d": "Alto", "q": "En la adjudicación de aprovechamientos resineros en montes catalogados de utilidad pública:", "o": ["Tienen preferencia en todo caso los resineros vecinos, que pueden ceder libremente el lote.", "Pueden tener preferencia, si lo acuerda la entidad propietaria, los resineros vecinos o de núcleos próximos y los adjudicatarios de las mismas matas en años precedentes, y se prohíbe la cesión o subarriendo a terceros más allá de lo permitido para la subcontratación.", "La adjudicación se hace por sorteo entre los resineros inscritos en el Registro de Empresas Forestales.", "La preferencia corresponde a las industrias de primera transformación de la resina."], "c": 1, "w": "Art. 53 bis.2 de la Ley 3/2009: la preferencia de los resineros vecinos o de núcleos próximos y de los adjudicatarios anteriores depende del acuerdo de la entidad propietaria. Se exige solvencia técnica y se prohíbe la cesión o subarriendo más allá de los márgenes de subcontratación de la legislación de contratos."}, {"d": "Medio", "q": "En un monte privado con instrumento de ordenación forestal en vigor, el titular quiere ejecutar un aprovechamiento maderable NO contemplado en dicho instrumento. Según la Ley 3/2009:", "o": ["Basta con presentar la declaración responsable del artículo 56.", "Se rige por el artículo 57, es decir, por el régimen de los montes sin instrumento de ordenación.", "Requiere autorización de la Junta de Castilla y León.", "Está prohibido hasta que se revise el instrumento de ordenación."], "c": 1, "w": "Art. 56.3 de la Ley 3/2009: los aprovechamientos no contemplados en el instrumento de ordenación se rigen por el art. 57 (autorización previa, salvo turno corto o menor cuantía). La declaración responsable del art. 56.1 sirve para los aprovechamientos conformes con el instrumento."}, {"d": "Fácil", "q": "Según la Ley 3/2009, la circulación y el aparcamiento de vehículos a motor en los montes:", "o": ["Requieren siempre autorización del ayuntamiento del término municipal.", "Solo están prohibidos en los montes catalogados de utilidad pública.", "No pueden realizarse fuera de las pistas forestales y de las zonas señaladas para aparcamiento, salvo por razones de emergencia, conservación, gestión y vigilancia, extinción de incendios o, excepcionalmente, con autorización expresa.", "Son libres en cualquier terreno forestal fuera de la época de peligro alto."], "c": 2, "w": "Art. 60.4 de la Ley 3/2009: la consejería regula la circulación y el aparcamiento, que no pueden realizarse fuera de pistas forestales y zonas de aparcamiento salvo en los supuestos tasados o con autorización expresa excepcional."}, {"d": "Alto", "q": "Para otorgar una concesión por razones de interés público en un monte catalogado, la entidad propietaria manifiesta su disconformidad. ¿Quién es competente para el otorgamiento?", "o": ["La Junta de Castilla y León.", "Nadie: el informe de la entidad propietaria impide continuar el procedimiento.", "El Pleno del ayuntamiento propietario.", "La consejería competente en materia de montes, sin tener en cuenta la disconformidad."], "c": 0, "w": "Art. 63.3 de la Ley 3/2009: en autorizaciones o concesiones por razones de interés público, si la entidad propietaria está disconforme, otorga la Junta de Castilla y León. El informe obstativo de la entidad opera solo cuando se trata de razones de interés privado (art. 63.2)."}, {"d": "Alto", "q": "La concesión demanial en un monte catalogado se otorga, como regla general, en régimen de concurrencia. ¿En cuál de los siguientes casos puede acordarse su otorgamiento directo?", "o": ["Cuando el solicitante sea vecino del municipio donde radica el monte.", "Cuando la ocupación no supere las 5 hectáreas.", "Cuando el solicitante sea una entidad sin ánimo de lucro declarada de utilidad pública.", "Cuando el solicitante ofrezca una contraprestación superior a la mínima."], "c": 2, "w": "Art. 65.1 de la Ley 3/2009: cabe otorgamiento directo si la concesión es accesoria de otra previa, si el solicitante es una entidad de derecho público, una entidad sin ánimo de lucro declarada de utilidad pública, una entidad privada que preste un servicio público o servicio económico de interés general, o tras un procedimiento de concurrencia fallido o desierto."}, {"d": "Medio", "q": "Una modificación de la cubierta vegetal de un monte que NO supone cambio de uso forestal requiere autorización de la consejería cuando:", "o": ["Afecta a más de 10 áreas de superficie.", "Se realiza en un monte privado sin instrumento de ordenación, en cualquier caso.", "Se ejecuta durante la época de peligro alto de incendios.", "Supone un cambio de la especie arbórea principal o implica riesgo de procesos erosivos intensos."], "c": 3, "w": "Art. 73.1 de la Ley 3/2009: precisan autorización las modificaciones que supongan cambio de especie arbórea principal, que impliquen riesgo de procesos erosivos intensos y otros casos reglamentarios. También la necesitan las vías forestales y obras con movimientos de tierra no previstas en el instrumento de planeamiento u ordenación (art. 73.2)."}, {"d": "Medio", "q": "En los montes que tengan la consideración de suelo rústico con protección natural, la Ley 3/2009 prohíbe:", "o": ["Cualquier tipo de construcción, incluidas las necesarias para la gestión forestal.", "Los usos recreativos y educativos.", "Únicamente los usos industriales que precisen evaluación de impacto ambiental.", "Las construcciones destinadas a vivienda unifamiliar aislada y los usos industriales, comerciales y de almacenamiento no vinculados a la gestión del monte."], "c": 3, "w": "Art. 81.1 de la Ley 3/2009: se prohíben los usos industriales, comerciales y de almacenamiento (salvo instalaciones de gestión del monte o imprescindibles para concesiones o autorizaciones) y las viviendas unifamiliares aisladas. El resto de usos del art. 23.2 de la Ley de Urbanismo quedan sujetos a autorización (art. 81.2)."}, {"d": "Alto", "q": "En los montes catalogados, protectores o con régimen especial de protección, quedan exentos de licencia urbanística municipal:", "o": ["Los actos de uso del suelo necesarios para su gestión técnico-facultativa cuando los promueva la consejería competente en materia de montes.", "Las construcciones promovidas por la entidad local propietaria del monte.", "Las instalaciones amparadas por una concesión demanial.", "Todos los actos de uso del suelo, sea quien sea el promotor."], "c": 0, "w": "Art. 82 de la Ley 3/2009: la exención alcanza a los actos de uso del suelo del art. 97 de la Ley 5/1999 necesarios para la gestión técnico-facultativa, cuando sean promovidos por la consejería."}, {"d": "Fácil", "q": "En materia de plagas y enfermedades forestales, los propietarios de los montes y los titulares de aprovechamientos forestales están obligados a:", "o": ["Comunicar su existencia a la consejería y extraer los productos forestales que constituyan riesgo grave e inminente de plaga en el plazo que esta determine.", "Declarar oficialmente la plaga mediante resolución propia.", "Comunicarla únicamente si la plaga está oficialmente declarada.", "Contratar un seguro que cubra los daños a montes colindantes."], "c": 0, "w": "Art. 84 de la Ley 3/2009: deben comunicar la existencia de plagas o enfermedades (84.1) y extraer los productos que constituyan riesgo grave e inminente, en el plazo que fije la consejería (84.3). La declaración oficial la hace la consejería por orden (art. 83.2)."}, {"d": "Medio", "q": "Las zonas de actuaciones prioritarias de restauración forestal:", "o": ["Se declaran por orden de la consejería, y las obras y trabajos necesarios para la restauración se declaran de utilidad pública a efectos de expropiación forzosa.", "Las declara el Ministerio competente a propuesta de la Comunidad.", "Se declaran por acuerdo de la Comisión Territorial de Mejoras.", "Se declaran por decreto de la Junta y conllevan la catalogación automática de los montes incluidos."], "c": 0, "w": "Art. 94 de la Ley 3/2009: declaración por orden de la consejería (94.1); las obras y trabajos de restauración se declaran de utilidad pública a efectos de expropiación (94.2); tienen tratamiento preferente en el fomento (94.3) y planes de actuación aprobados por orden (art. 95)."}, {"d": "Medio", "q": "Las ordenanzas reguladoras de distancias entre plantaciones con especies forestales y cultivos NO podrán imponer distancias mínimas de plantación superiores a una cifra comprendida entre:", "o": ["Doce y veinticinco metros, según la altura de la especie forestal.", "Seis y doce metros, según se determine reglamentariamente en función de las orientaciones y los cultivos.", "Diez y veinte metros, según la pendiente del terreno.", "Tres y seis metros, según la especie forestal plantada."], "c": 1, "w": "Art. 98 de la Ley 3/2009: el máximo exigible por las ordenanzas estará comprendido entre seis y doce metros, según lo que se determine reglamentariamente en función de orientaciones y cultivos."}, {"d": "Fácil", "q": "Respecto a las entidades selvícolas de colaboración, la Ley 3/2009 establece que:", "o": ["No tendrán en ningún caso la condición de autoridad y su actuación no podrá impedir ni interferir la función de verificación, control e inspección de la consejería.", "Pueden imponer sanciones por delegación de la consejería.", "Sustituyen a la consejería en la inspección de los aprovechamientos.", "Tienen la condición de agentes de la autoridad cuando actúan por cuenta de la consejería."], "c": 0, "w": "Art. 103 bis.6 de la Ley 3/2009: estas entidades no tienen en ningún caso la condición de autoridad ni pueden interferir en las funciones de verificación, control e inspección de la consejería. Deben tener carácter técnico y personalidad jurídica propia (103 bis.8)."}, {"d": "Alto", "q": "Los convenios que la consejería puede suscribir con partes interesadas para fomentar la provisión de servicios ecosistémicos en los montes catalogados tendrán un plazo máximo de:", "o": ["20 años, sin perjuicio de la posibilidad de prórroga a su término.", "4 años, prorrogables por otros 4.", "25 años improrrogables.", "La duración del turno de la especie principal, en todo caso."], "c": 0, "w": "Art. 104 bis.4 de la Ley 3/2009: plazo máximo de 20 años, prorrogables a su término. La duración máxima del turno de las especies se refiere a los contratos de cesión de servicios ecosistémicos con valor de mercado que suscriben las entidades titulares (104 bis.5)."}, {"d": "Medio", "q": "Para los gastos de funcionamiento de la Comisión Territorial de Mejoras se destinará del Fondo de Mejoras una parte que no podrá exceder:", "o": ["Del diez por ciento.", "Del treinta por ciento.", "Del cinco por ciento.", "Del quince por ciento."], "c": 2, "w": "Art. 108.6 de la Ley 3/2009: los gastos de funcionamiento de la Comisión no pueden superar el 5 % del Fondo de Mejoras. La Comisión está integrada paritariamente por la Administración autonómica y las entidades propietarias (art. 110.1)."}, {"d": "Medio", "q": "La inexactitud, falsedad u omisión, de carácter esencial, de cualquier dato que figure en una declaración responsable de aprovechamiento se califica, según la Ley 3/2009, como infracción:", "o": ["Leve.", "Leve o grave según el plazo de reparación del daño causado.", "Grave.", "Muy grave."], "c": 2, "w": "Arts. 113.l) y 114.2.h) de la Ley 3/2009: la infracción tipificada en la letra l) (inexactitud, falsedad u omisión esencial en declaraciones responsables o comunicaciones) es siempre grave, sin depender del plazo de reparación."}, {"d": "Alto", "q": "En una infracción continuada a la Ley 3/2009, el plazo de prescripción comienza a contarse desde:", "o": ["La fecha del acuerdo de iniciación del procedimiento sancionador.", "El día en que se cometió el primer acto constitutivo de la infracción.", "La fecha de finalización de la actividad o la del último acto en que la infracción se consumare.", "La fecha en que el agente medioambiental formuló la denuncia."], "c": 2, "w": "Art. 115.2 de la Ley 3/2009: como regla, el plazo corre desde el día de comisión; en las infracciones continuadas, desde la finalización de la actividad o el último acto; si el hecho no se manifestaba externamente, desde la aparición de signos externos."}, {"d": "Medio", "q": "Según el artículo 118 de la Ley 3/2009, la multa se impondrá en la cuantía máxima correspondiente al tipo de infracción cuando:", "o": ["El beneficio económico del infractor sea superior a la máxima sanción prevista para ese tipo, sin perjuicio de la obligación de indemnizar.", "El infractor no colabore en la disminución de los efectos de la infracción.", "La infracción se cometa en un monte catalogado de utilidad pública.", "El infractor sea reincidente, en todo caso."], "c": 0, "w": "Art. 118.4 de la Ley 3/2009: si el beneficio económico supera la sanción máxima del tipo, la multa se impone en su cuantía máxima. La reincidencia y la colaboración son criterios de graduación (118.1), no causas automáticas de cuantía máxima."}, {"d": "Alto", "q": "En un monte privado en pro indiviso, un copropietario comunica su intención de ejercitar la acción de división. Los demás copropietarios conocidos pueden ejercer un derecho de adquisición preferente sobre su cuota en el plazo máximo de:", "o": ["Seis meses desde la inscripción registral; si concurren varios, se decide por sorteo.", "Un mes desde la notificación; si concurren varios, adquiere el de mayor cuota.", "Dos meses desde la comunicación; solo puede ejercerlo un único copropietario.", "Tres meses desde que tuvieron conocimiento de la intención de dividir; si concurren varios, la cuota se reparte a prorrata de su participación."], "c": 3, "w": "Disposición adicional octava.3 de la Ley 3/2009: notificación fehaciente en un plazo máximo de tres meses desde que se tuvo conocimiento de la intención de dividir; si hay varios interesados, se distribuye a prorrata. El registrador no inscribe la división sin justificar este procedimiento."}, {"d": "Fácil", "q": "Según el Decreto 5/2025, el plazo para ejecutar un aprovechamiento forestal, salvo que las disposiciones específicas establezcan otro, es de:", "o": ["Dos años para todos los aprovechamientos.", "Seis meses para los maderables y leñosos y un año para el resto.", "Un año para todos los aprovechamientos.", "Dos años para los maderables y leñosos y un año para el resto."], "c": 3, "w": "Art. 14.1 del Decreto 5/2025: dos años para maderables y leñosos y un año para los demás. Si no se ejecuta en plazo, la autorización o declaración queda sin efecto, sin perjuicio de presentar una nueva (art. 14.2)."}, {"d": "Medio", "q": "La presentación presencial de la solicitud de autorización o de la declaración responsable de aprovechamiento solo es posible cuando:", "o": ["Se trate de una persona física y el aprovechamiento sea de menor cuantía.", "El solicitante carezca de certificado electrónico, sea persona física o jurídica.", "Se trate de cualquier persona física, sea cual sea la cuantía.", "El aprovechamiento se realice en un único recinto SIGPAC."], "c": 0, "w": "Art. 7.2.b) del Decreto 5/2025: la vía presencial queda reservada a personas físicas con aprovechamientos de menor cuantía. El resto está obligado a relacionarse electrónicamente, al amparo del art. 14.3 de la Ley 39/2015."}, {"d": "Alto", "q": "Un agricultor quiere cortar varios pies de una alineación forestal dispersa de 6 áreas situada en su parcela de cereal. Según el Decreto 5/2025, necesita:", "o": ["Nada, porque las formaciones de menos de 10 áreas no son monte y no están reguladas.", "Presentar una declaración responsable.", "Obtener autorización del servicio territorial.", "Obtener autorización de la dirección general."], "c": 1, "w": "Art. 5.3 del Decreto 5/2025: los aprovechamientos maderables o leñosos en arbolado aislado y formaciones o alineaciones forestales dispersas en terrenos agrícolas inferiores a 10 áreas están sujetos a declaración responsable (en relación con la disposición adicional cuarta de la Ley 3/2009)."}, {"d": "Medio", "q": "Durante un aprovechamiento se detecta en un pie un nido de una especie catalogada como vulnerable. Según el Decreto 5/2025, el titular debe:", "o": ["Continuar con la corta y comunicarlo en la comunicación de cuantía final.", "Suspender todo el aprovechamiento hasta el final de la época de cría.", "Retirar el nido y trasladarlo a un pie cercano antes de cortar.", "Excluir provisionalmente ese pie del aprovechamiento y comunicarlo de inmediato al servicio territorial, que fijará las condiciones de obligado cumplimiento."], "c": 3, "w": "Art. 12.1.d) del Decreto 5/2025: se excluyen provisionalmente los pies con nidos de especies en peligro de extinción o vulnerables (Catálogo Español o de Castilla y León) y se comunica inmediatamente al servicio territorial, que establece las condiciones necesarias."}, {"d": "Medio", "q": "En un aprovechamiento sometido a autorización, el titular pretende eliminar los restos mediante quema. Según el Decreto 5/2025:", "o": ["La solicitud de quema se incluye expresamente en la propia solicitud del aprovechamiento, y la resolución recoge, cuando proceda, las determinaciones sobre la quema.", "La quema de restos está prohibida; solo cabe la trituración.", "Debe presentar una solicitud independiente ante el ayuntamiento.", "No necesita solicitud ni comunicación alguna."], "c": 0, "w": "Art. 13.2 del Decreto 5/2025: la quema se solicita o comunica conforme a la normativa del uso del fuego, pero en los aprovechamientos sometidos a autorización se incluye en la propia solicitud. La trituración o extracción de restos no requiere autorización (art. 13.1)."}, {"d": "Alto", "q": "En una dehesa de encina, tras un aprovechamiento el número de pies vivos queda por debajo de 30 por hectárea. Salvo previsión contraria del instrumento de ordenación:", "o": ["Debe regenerarse en diez años, con una fracción de cabida cubierta mínima del 40 %.", "Es obligatorio regenerar en un plazo máximo de cinco años; se considera regenerada con al menos 30 pies viables/ha o una fracción de cabida cubierta del 20 %, protegidos frente a herbívoros.", "Es obligatorio regenerar en dos años, con al menos 600 pies viables/ha.", "No existe obligación de regenerar, porque las dehesas son terrenos agrosilvopastorales."], "c": 1, "w": "Disposición transitoria primera, 1.c).4 del Decreto 5/2025: en dehesas de Quercus o Fraxinus, si quedan menos de 30 pies vivos/ha, regeneración obligatoria en cinco años; se entiende regenerada con 30 pies viables/ha o FCC del 20 %, protegidos y distribuidos uniformemente."}, {"d": "Alto", "q": "Si se astilla la madera de un aprovechamiento, los montones de astillas deben:", "o": ["Cubrirse con lonas y retirarse en un plazo máximo de dos semanas, sin requisitos de distancia.", "Situarse a más de 50 metros del arbolado, con una banda de 3 metros, y retirarse en un mes.", "Situarse a más de 400 metros del monte y retirarse antes del inicio de la época de peligro alto.", "Situarse a más de 100 metros del arbolado, rodeados de una banda sin vegetación de al menos 9 metros, y los depósitos provisionales retirarse en un máximo de 15 días."], "c": 3, "w": "Disposición transitoria primera, 1.d).2 del Decreto 5/2025: distancia superior a 100 m del arbolado, banda exenta de vegetación de al menos 9 m y retirada de los depósitos provisionales en un máximo de 15 días."}, {"d": "Medio", "q": "En las formaciones de enebros y sabinas (Juniperus communis, J. oxycedrus y J. thurifera), el aprovechamiento solo puede ejecutarse mediante:", "o": ["Cortas a hecho por fajas de no más de 1 hectárea, separadas cinco años.", "Clareos, claras o cortas de entresaca que no superen el 25 % del área basimétrica en cada intervención, separadas al menos quince años.", "Cortas de entresaca que no superen el 33 % de la fracción de cabida cubierta, separadas diez años.", "Claras que no superen el 50 % de los pies vivos, separadas al menos cinco años."], "c": 1, "w": "Disposición transitoria primera, 1.f).1 del Decreto 5/2025: clareos, claras o entresacas con extracción máxima del 25 % del área basimétrica y quince años entre intervenciones. Los límites del 50 % de pies y 33 % de FCC con cinco años corresponden a las formaciones de ribera (1.f).2)."}, {"d": "Alto", "q": "En la declaración responsable de un aprovechamiento de piña cerrada, el titular estima una producción de 400 kg de piña por hectárea. Según el Decreto 5/2025:", "o": ["No debe justificar nada; solo si la producción final supera el doble debe comunicarlo.", "Debe justificar la estimación por superar 300 kg/ha; la rectificativa procede si se supera en un 10 %.", "Debe justificar esa estimación en la propia declaración, por superar 350 kg/ha; y si después prevé superar en más de un 20 % lo declarado, presentará una declaración rectificativa.", "Necesita autorización del servicio territorial, por superar 350 kg/ha."], "c": 2, "w": "Disposición transitoria primera, 2.d) del Decreto 5/2025: si la producción estimada puede superar 350 kg/ha, se justifica en la declaración; si, iniciado el aprovechamiento, se prevé superar en más de un 20 % lo consignado, se presenta declaración responsable rectificativa."}, {"d": "Medio", "q": "En los aprovechamientos de resina, cuando se realiza un desroñe previo de las entalladuras, este debe hacerse obligatoriamente:", "o": ["En cualquier momento, salvo en la época de peligro alto de incendios.", "Entre el 1 de febrero y el 30 de abril, ambos inclusive.", "Entre el 15 de junio y el 30 de septiembre, ambos inclusive.", "Entre el 11 de noviembre y el 10 de abril del año siguiente."], "c": 1, "w": "Disposición transitoria primera, 3.b).1 del Decreto 5/2025: el desroñe previo se hace entre el 1 de febrero y el 30 de abril. Los sistemas admitidos son Hugues, pica de corteza ascendente o descendente y rayón ascendente o descendente (3.c).1)."}, {"d": "Fácil", "q": "Según el Decreto 9/2024, ¿puede autorizarse el cambio de uso forestal de un monte que forma parte de una microrreserva de fauna o flora?", "o": ["Sí, si la superficie afectada es inferior a 5 hectáreas.", "Sí, previo informe favorable de evaluación de repercusiones sobre la Red Natura 2000.", "Sí, si se compensa con el doble de superficie adscrita al uso forestal.", "No, en ningún caso."], "c": 3, "w": "Art. 3.e) del Decreto 9/2024: no se autoriza en ningún caso el cambio de uso forestal en montes que formen parte de una microrreserva de fauna o flora."}, {"d": "Medio", "q": "Respecto a los montes que albergan ejemplares declarados como árboles notables, el Decreto 9/2024 establece que no se autorizará el cambio de uso forestal:", "o": ["Solo cuando el cambio de uso supere las 10 hectáreas.", "En ningún caso, aunque el cambio no afecte a los árboles.", "Solo si los árboles notables están además en un espacio natural protegido.", "Cuando el cambio de uso pueda poner en peligro a esos ejemplares."], "c": 3, "w": "Art. 3.f) del Decreto 9/2024: la prohibición se aplica a los montes con árboles notables cuando el cambio de uso pueda ponerlos en peligro."}, {"d": "Medio", "q": "¿Cuál de los siguientes supuestos impide en todo caso autorizar el cambio de uso forestal según el artículo 3 del Decreto 9/2024?", "o": ["Que el monte tenga una pendiente superior al 15 %.", "Que el monte constituya hábitats o formaciones vegetales con representación escasa o estado de conservación deficitario en el entorno comarcal.", "Que el monte sea de propiedad privada en pro indiviso.", "Que el monte esté situado a menos de 100 metros de un casco urbano."], "c": 1, "w": "Art. 3.g) del Decreto 9/2024. La pendiente superior al 15 % no impide la autorización, sino que obliga a garantizar medidas antierosivas (art. 5.2)."}, {"d": "Alto", "q": "En relación con los instrumentos de planeamiento urbanístico, el artículo 7 del Decreto 9/2024 dispone que:", "o": ["La reclasificación de montes requiere autorización de cambio de uso de la Delegación Territorial, tramitada después de aprobar el planeamiento.", "Solo los montes catalogados quedan excluidos de la clasificación como suelo urbano; el resto requiere informe no preceptivo.", "Los montes enumerados en el artículo 21.2 de la Ley 4/2015, del Patrimonio Natural de Castilla y León, no podrán clasificarse como urbanos o urbanizables, y la reclasificación de suelo que fuera monte exige informe previo y preceptivo de la consejería, sin el cual no puede recaer resolución.", "Cualquier monte puede reclasificarse como urbanizable con informe facultativo de la consejería."], "c": 2, "w": "Art. 7 del Decreto 9/2024: los montes del art. 21.2 de la Ley 4/2015 no pueden ser urbanos ni urbanizables (7.1); en la reclasificación de suelo que fuera monte es preceptivo el informe previo de la consejería (art. 80 de la Ley 3/2009) y no puede resolverse sin él (7.2)."}, {"d": "Fácil", "q": "Según el Decreto 9/2024, están obligados a presentar la solicitud de autorización de cambio de uso forestal de forma electrónica:", "o": ["Todas las personas, físicas o jurídicas.", "Las personas jurídicas y el resto de sujetos del artículo 14.2 de la Ley 39/2015.", "Solo quienes soliciten más de 10 hectáreas.", "Nadie; la presentación electrónica es siempre voluntaria."], "c": 1, "w": "Art. 9.3 del Decreto 9/2024: la solicitud puede presentarse presencial o electrónicamente, pero las personas jurídicas y los demás sujetos del art. 14.2 de la Ley 39/2015 están obligados a hacerlo de forma electrónica."}, {"d": "Alto", "q": "Se solicita un cambio de uso forestal con destino agrícola sobre terrenos con un 18 % de pendiente. Además de la documentación general, la solicitud debe acompañarse de:", "o": ["Un informe favorable de la Confederación Hidrográfica de la cuenca.", "Un estudio de impacto ambiental ordinario firmado por técnico competente.", "Una memoria descriptiva de las medidas para evitar procesos erosivos, firmada por técnico titulado autorizado para proyectos de corrección de la erosión, y una declaración responsable del compromiso de ejecutarlas.", "Un plan de reforestación de una superficie equivalente en el entorno comarcal."], "c": 2, "w": "Art. 10.1.c) del Decreto 9/2024: para cultivo agrícola en terrenos de más del 15 % de pendiente se exige memoria de medidas antierosivas, firmada por técnico universitario autorizado para proyectos de corrección de la erosión, y declaración responsable del compromiso de llevarlas a la práctica."}, {"d": "Medio", "q": "En la instrucción del procedimiento ordinario de cambio de uso forestal, el servicio territorial debe solicitar en todo caso:", "o": ["El informe de Evaluación de las Repercusiones sobre la Red Natura 2000 y, si la finalidad es agrícola, un informe del servicio territorial competente en agricultura sobre los requisitos del artículo 5.1.", "El dictamen del Consejo Regional de Medio Ambiente.", "La declaración de impacto ambiental, en todos los casos.", "El informe del ayuntamiento y de la Diputación Provincial."], "c": 0, "w": "Art. 11.3 del Decreto 9/2024: además de los informes preceptivos y necesarios, en todo caso se pide el informe de agricultura en las solicitudes de finalidad agrícola (11.3.a) y el informe de Evaluación de Repercusiones sobre la Red Natura 2000 (11.3.b)."}, {"d": "Alto", "q": "En el procedimiento simplificado de reversión al uso agrícola, ¿cuál de los siguientes documentos NO forma parte de la documentación que debe acompañar a la solicitud?", "o": ["La salida gráfica del SIGPAC o plano a escala 1:5.000 o mayor.", "La declaración responsable de ser la persona o entidad propietaria de los terrenos.", "La declaración responsable de que el terreno se ha cultivado en alguno de los últimos 30 años.", "La declaración responsable de disponibilidad de terrenos agrícolas para adscribirlos al uso forestal."], "c": 3, "w": "Art. 13.3 del Decreto 9/2024: el simplificado exige solo la documentación de las letras a), b), d), f) y h) del art. 10.1. La adscripción de terrenos al uso forestal (letra g) se vincula a los supuestos del art. 5.1 b), c) y d), que no siguen este procedimiento."}, {"d": "Medio", "q": "Se solicita un cambio de uso sobre terrenos de un monte que ya tuvo otras autorizaciones de cambio de uso. A efectos de los límites y condiciones del artículo 5 del Decreto 9/2024:", "o": ["Solo se computa la superficie de la nueva solicitud.", "Se tienen en cuenta conjuntamente los terrenos de la solicitud en curso y los de los expedientes previamente autorizados.", "Las autorizaciones anteriores solo se computan si se concedieron en los últimos cinco años.", "La nueva solicitud debe tramitarse siempre por la Dirección General."], "c": 1, "w": "Art. 5.5 del Decreto 9/2024: cuando el monte ya ha sido objeto de autorizaciones previas, se consideran conjuntamente los terrenos de la solicitud en curso y los ya autorizados. Así se evita fraccionar solicitudes para eludir los límites de superficie."}, {"d": "Fácil", "q": "El Decreto 9/2024, de 6 de junio, que regula las autorizaciones de cambio de uso forestal:", "o": ["Derogó la Ley 5/1994, de Fomento de Montes Arbolados, y entró en vigor a los tres meses de su publicación.", "Derogó el Decreto 292/1991, que regulaba la roturación de terrenos forestales para su cultivo agrícola, y entró en vigor a los veinte días de su publicación en el BOCYL.", "Derogó el Decreto 1/2012, de aprovechamientos maderables, y entró en vigor al día siguiente de su publicación.", "No derogó ninguna norma y entró en vigor al mes de su publicación."], "c": 1, "w": "Disposición derogatoria y disposición final segunda del Decreto 9/2024: deroga el Decreto 292/1991 y entra en vigor a los veinte días de su publicación en el BOCYL (10 de junio de 2024)."}];

const L = "abcd";
let i = 0, hits = 0, answered = false, fails = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const it = DATA[i];
  answered = false;
  document.getElementById("cnt").textContent = (i+1)+" / "+DATA.length;
  document.getElementById("barfill").style.width = (i/DATA.length*100)+"%";
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  let h = '<div class="qhead"><span>Pregunta '+(i+1)+'</span><span class="tag">'+it.d+'</span></div>';
  h += '<p class="q">'+esc(it.q)+'</p>';
  it.o.forEach((o,k)=>{ h += '<button class="opt" data-k="'+k+'" onclick="pick('+k+')"><b>'+L[k]+')</b><span>'+esc(o)+'</span></button>'; });
  h += '<div class="why" id="why"></div>';
  h += '<div class="actions"><button class="btn" id="next" disabled onclick="next()">'+(i<DATA.length-1?"Siguiente":"Ver resultado")+'</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function pick(k){
  if(answered) return; answered = true;
  const it = DATA[i], btns = document.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);
  btns[it.c].classList.add("ok");
  const why = document.getElementById("why");
  if(k===it.c){ hits++; why.className="why ok"; why.innerHTML="<b>Correcto.</b> "+esc(it.w); }
  else { btns[k].classList.add("ko"); fails.push(i); why.className="why ko"; why.innerHTML="<b>Incorrecto. La respuesta correcta es la "+L[it.c]+").</b> "+esc(it.w); }
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  document.getElementById("next").disabled = false;
}

function next(){ if(i<DATA.length-1){ i++; render(); } else finish(); }

function finish(){
  document.getElementById("barfill").style.width = "100%";
  const nota = (hits/DATA.length*10).toFixed(2).replace(".",",");
  const msg = hits>=Math.ceil(DATA.length*0.85) ? "Excelente. Dominas el tema." : hits>=Math.ceil(DATA.length*0.5) ? "Aprobado. Repasa las preguntas falladas." : "Necesitas repasar el tema.";
  let h = '<div class="result"><p style="margin:0;color:var(--gris)">Resultado</p><div class="big">'+nota+'</div>';
  h += '<p><b>'+hits+'</b> aciertos de '+DATA.length+'. '+msg+'</p></div>';
  if(fails.length){
    h += '<div class="result"><p style="text-align:left;font-weight:bold;margin-top:18px">Preguntas falladas</p><ul>';
    fails.forEach(f=>{ const it=DATA[f]; h += '<li><b>'+(f+1)+'.</b> '+esc(it.q)+'<br><span style="color:var(--ok)">Correcta: '+L[it.c]+') '+esc(it.o[it.c])+'</span></li>'; });
    h += '</ul></div>';
  }
  h += '<div class="actions" style="justify-content:center"><button class="btn" onclick="restart()">Repetir el test</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function restart(){ i=0; hits=0; fails=[]; render(); }

/* ---- Acceso docente ---- */
function toggleLock(){ const l=document.getElementById("lock"); l.style.display = l.style.display==="block"?"none":"block"; if(l.style.display==="block") document.getElementById("pw").focus(); }
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function unlock(){
  const msg = document.getElementById("lockmsg"); msg.textContent = "";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.s), iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c));
    document.getElementById("wordbody").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("pw").value = "";
    document.getElementById("lock").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("foot").style.display = "none";
    document.getElementById("word").style.display = "block";
    window.scrollTo(0,0);
  }catch(e){ msg.textContent = "Contraseña incorrecta."; }
}
function closeWord(){
  document.getElementById("wordbody").innerHTML = "";
  document.getElementById("word").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("foot").style.display = "block";
}
async function copyWord(){
  const body = document.getElementById("wordbody"), m = document.getElementById("copymsg");
  try{
    await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([body.innerHTML],{type:"text/html"}),"text/plain":new Blob([body.innerText],{type:"text/plain"})})]);
    m.textContent = "Copiado. Pégalo en Word.";
  }catch(e){
    const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try{ document.execCommand("copy"); m.textContent = "Copiado. Pégalo en Word."; }catch(e2){ m.textContent = "Selecciona el texto y copia con Ctrl+C."; }
    s.removeAllRanges();
  }
}
function downloadDoc(){
  const doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:11pt}</style></head><body>'+document.getElementById("wordbody").innerHTML+'</body></html>';
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿",doc],{type:"application/msword"}));
  a.download = "Test_Normativa_Montes_50.doc"; document.body.appendChild(a); a.click(); a.remove();
}
render();
</script>
